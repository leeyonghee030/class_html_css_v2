<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>레이아웃 7가지 패턴</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
      }

      /* 패턴1  */
      .demo-center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box {
        background-color: #333;
        padding: 20px 40px;
        border-radius: 8px;
        margin-top: 20px;
        color: #f1f5f9;
      }
      /* 패턴2 */
      .demo-nav {
        display: flex;
        justify-content: space-between;
        background-color: #333;
        padding: 0 20px;
        height: 60px;
        align-items: center;
        margin: 20px 0;
        color: white;
      }
      .demo-nav a {
        text-decoration: none;
        color: white;
        font-weight: 300;
        margin-left: 20px;
      }
      /* 패턴3 카드 그리드 */

      .demo-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        background-color: #f9fbfc;
        padding: 20px;
        margin-bottom: 20px;
      }
      .card {
        flex: 1 1 200px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 30px;
        border-radius: 8px;
        text-align: center;
      }
      /* 패턴4 */
      .demo-sideber-layout {
        display: flex;
        min-height: 200px;
        margin-bottom: 20px;
      }
      .sidebar {
        width: 200px;
        background-color: #1e293c;
        color: white;
        padding: 20px;
      }
      .content {
        flex: 1;
        background-color: #f1f5f9;
        padding: 20px;
      }
      /* 패턴 5 히어로  */
      .demo-hero {
        height: 300px;
        display: flex;
        background: url("https://picsum.photos/seed/hero/1200/300") center/cover;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 32px;
        margin-bottom: 20px;
        text-shadow: 10px 10px 8px rgba(0, 0, 0, 0.5);
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .content-wrapper {
        flex: 1;
      }

      footer {
        padding: 20px;
        background-color: #1e293c;
        color: white;
        text-align: center;
      }

      /* 패턴7 반응형 */
      .demo-responsive {
        display: flex;
        gap: 20px;
        padding: 20px;
      }
      .col {
        flex: 1;
        background-color: aliceblue;
        padding: 30px;
        border-radius: 8px;
        text-align: center;
      }
      @media (max-width: 768px) {
        .demo-responsive {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <!-- 6.스티키푸터 -->
    <div class="content-wrapper">
      <!--패턴1 완전 가운데 정렬 -->
      <section class="demo-center">
        <div class="box">패턴1: 완전 가운데</div>
      </section>
      <!-- 패턴2 navbar  -->
      <nav class="demo-nav">
        <span>Logo</span>
        <div>
          <a href="#">메뉴1</a>
          <a href="#">메뉴2</a>
          <a href="#">메뉴3</a>
        </div>
      </nav>
      <!-- 패턴3 카드 그리드 -->
      <section class="demo-grid">
        <div class="card">카드 1</div>
        <div class="card">카드 2</div>
        <div class="card">카드 3</div>
        <div class="card">카드 4</div>
      </section>

      <!-- 패턴4  사이드바 +메인 -->
      <div class="demo-sideber-layout">
        <aside class="sidebar">사이드바</aside>
        <div class="content">메인 콘텐츠</div>
      </div>

      <!--  패턴5 히어로 섹션-->
      <div class="demo-hero">
        <h2>히어로 섹션</h2>
      </div>
      <!-- 패턴 7 반응형 2단에서 1단으로 -->
      <div class="demo-responsive">
        <div class="col">왼쪽</div>
        <div class="col">오른쪽</div>
      </div>
    </div>
    <!-- 패턴6 스티키 푸터 -->
    <footer>2026 CSS LAYOUT Patterns...</footer>
  </body>
</html>
