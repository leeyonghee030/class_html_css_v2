<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>애플 클론 코디</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <span class="nav-logo">Apple</span>
      <nav class="nav">
        <a href="#">iPhone</a>
        <a href="#">Mac</a>
        <a href="#">iPad</a>
      </nav>
    </header>
    <main>
      <section class="hero">
        <h1>iPhone 17 Pro</h1>
        <p>지금까지와는 차원이 다른</p>
        <div class="hero-buttons">
          <a href="#" class="btn btn-primary">더 알아보기</a>
          <a href="#" class="btn btn-secindary">구입하기</a>
        </div>
      </section>
      <section class="features">
        <h2>주요 특징</h2>
        <div class="feature-cards">
          <div class="feature-card">
            <h3>48MP 카메라</h3>
            <p>프로급 사진을 찍어보세요</p>
          </div>
          <div class="feature-card">
            <h3>A18 Pro칩</h3>
            <p>가장 빠른 모바일 칩</p>
          </div>
          <div class="feature-card">
            <h3>하루 종일 배터리</h3>
            <p>충전 걱정 없이</p>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <p>clone coding practice</p>
    </footer>
  </body>
</html>
