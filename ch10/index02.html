<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="stlye3.css" />
  </head>
  <body>
    <div class="box">
      <div class="blog-field">
        <p>블로그명</p>
        <div class="blog-field-box">
          <input
            class="blog-input"
            type="text"
            placeholder="블로그 명을 적어주세요"
            value="Green's Blog"
          />
          <p><small>한글,영문,숫자 혼용 가능 (4~25자이내)</small></p>
        </div>
      </div>
      <div class="back-field">
        <p>상단 배경</p>
        <div class="back-field-box">
          <div class="back-input-box">
            <button>이미지 등록</button>
            <input
              class="back-input"
              type="text"
              placeholder="배경 이미지.jpg"
            />
          </div>
          <p><small>가로 1000px,세로 80~300px</small></p>
        </div>
      </div>

      <div class="yt-field">
        <p>YouTube</p>
        <div class="yt-field-box">
          <input
            class="yt-input"
            type="text"
            placeholder="http://www.youtube.com/@User ID"
          />
          <p><small>User ID 입력</small></p>
        </div>
      </div>
      <div class="isg-field">
        <p>Instagram</p>
        <div class="isg-field-box">
          <input
            class="isg-input"
            type="text"
            placeholder="http://www.instagram.com/User ID"
          />
          <p><small>User ID 입력</small></p>
        </div>
      </div>

      <div class="btn">
        <button class="btn-1">취소</button>
        <button class="btn-2">확인</button>
      </div>
    </div>
  </body>
</html>
